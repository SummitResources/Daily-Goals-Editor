<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <!-- The MAUI app icon (Resources/AppIcon): appicon.svg's indigo tile under appiconfg.svg's day card. -->
    <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6366F1" />
            <stop offset="1" stop-color="#4338CA" />
        </linearGradient>
    </defs>
    <rect x="44.5" y="44.5" width="367" height="367" rx="82" ry="82" fill="url(#tile)" />
    <!-- card -->
    <rect x="128" y="118" width="200" height="228" rx="26" ry="26" fill="#FFFFFF" />
    <!-- header band -->
    <path d="M128,174 V144 A26,26 0 0 1 154,118 H302 A26,26 0 0 1 328,144 V174 Z" fill="#F59E0B" />
    <!-- binder rings -->
    <rect x="171" y="100" width="16" height="38" rx="8" ry="8" fill="#FFFFFF" />
    <rect x="269" y="100" width="16" height="38" rx="8" ry="8" fill="#FFFFFF" />
    <circle cx="179" cy="130" r="5" fill="#B45309" />
    <circle cx="277" cy="130" r="5" fill="#B45309" />

    <!-- goal 1: done -->
    <circle cx="170" cy="212" r="15" fill="#0F8A72" />
    <path d="M162.5,212.5 L168,218 L178,206.5" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="198" y="206" width="104" height="12" rx="6" ry="6" fill="#D1D5DB" />

    <!-- goal 2: done -->
    <circle cx="170" cy="260" r="15" fill="#0F8A72" />
    <path d="M162.5,260.5 L168,266 L178,254.5" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="198" y="254" width="88" height="12" rx="6" ry="6" fill="#D1D5DB" />

    <!-- goal 3: open -->
    <circle cx="170" cy="308" r="13" fill="none" stroke="#A5B4FC" stroke-width="4" />
    <rect x="198" y="302" width="96" height="12" rx="6" ry="6" fill="#4F46E5" />
</svg>
